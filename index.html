<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Championship Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=Barlow:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0b0e;--panel:#14161b;--panel2:#1b1e25;--ink:#f3f4f6;--mute:#8a919e;--line:#262a33;--red:#e10600;--tc:#8a919e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif;min-height:100vh;
 background-image:radial-gradient(900px 420px at 85% -10%,rgba(225,6,0,.22),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(54,113,198,.12),transparent 60%)}
.flag{height:14px;background:repeating-conic-gradient(#f3f4f6 0 25%,#0a0b0e 0 50%) 0 0/14px 14px;background-position:0 0;animation:flag 6s linear infinite;opacity:.9}
@keyframes flag{to{background-position:56px 0}}
.wrap{max-width:860px;margin:0 auto;padding:30px 16px 70px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font:italic 800 clamp(40px,9vw,72px)/.9 "Barlow Condensed",Impact,sans-serif;letter-spacing:-.01em;text-transform:uppercase}
h1 span{color:var(--red)}
.sub{color:var(--mute);margin-top:10px;font-size:15px}
select{font:500 16px Barlow,sans-serif;padding:9px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:26px 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--red);border-radius:7px;transition:transform .35s cubic-bezier(.3,1.3,.5,1);box-shadow:0 6px 24px rgba(225,6,0,.4)}
.tabs.c .pill{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;font:700 21px "Barlow Condensed",sans-serif;letter-spacing:.02em;padding:10px;background:none;color:var(--mute);border:0;cursor:pointer;transition:color .25s}
.tabs button[aria-selected=true]{color:#fff}
button:focus-visible,select:focus-visible,.row:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.meta{color:var(--mute);font-size:14px;margin:12px 2px}
#list{display:grid;gap:8px}
.row{--tc:#8a919e;position:relative;display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 18px;overflow:hidden;
 opacity:0;transform:translateX(-24px);animation:in .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*45ms);transition:transform .25s,border-color .25s,background .25s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc);transition:width .25s}
.row::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s}
@keyframes in{to{opacity:1;transform:none}}
.row.click{cursor:pointer}
.row.click:hover{transform:translateX(6px);border-color:var(--tc);background:var(--panel2)}
.row:hover::before{width:9px}.row:hover::after{transform:translateX(120%)}
.pos{font:800 34px "Barlow Condensed",sans-serif;text-align:center;color:var(--mute)}
.row:nth-child(-n+3) .pos{color:var(--ink)}
.name{font:700 24px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
.name small{font:400 14px Barlow,sans-serif;color:var(--mute);margin-left:8px}
.track{height:5px;background:#232731;margin-top:8px;border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--tc);border-radius:3px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*45ms + 250ms)}
@keyframes grow{to{width:var(--w)}}
.pts{text-align:right;font:800 32px "Barlow Condensed",sans-serif;line-height:1}
.pts small{display:block;font:400 12px Barlow,sans-serif;color:var(--mute);margin-top:2px}
.state{padding:44px 16px;text-align:center;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:12px}
.spin{width:30px;height:30px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.state button{margin-top:12px;font:500 15px Barlow,sans-serif;padding:8px 16px;cursor:pointer;background:var(--red);color:#fff;border:0;border-radius:8px}
footer{margin-top:26px;font-size:13px;color:var(--mute)}
.ov{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:rgba(5,6,8,.72);backdrop-filter:blur(6px);z-index:10}
.ov.open{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{--tc:#8a919e;position:relative;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:16px;padding:26px 24px 22px;animation:pop .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}}
.big{position:absolute;right:-6px;top:-18px;font:italic 800 190px/1 "Barlow Condensed",sans-serif;color:var(--tc);opacity:.18;pointer-events:none;user-select:none}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:18px;cursor:pointer;z-index:2;transition:transform .25s}
.x:hover{transform:rotate(90deg)}
.code{font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.14em;color:var(--tc)}
.card h2{margin:2px 0 4px;font:italic 800 42px/.95 "Barlow Condensed",sans-serif;text-transform:uppercase;position:relative}
.card .team{color:var(--mute);margin-bottom:20px;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{display:block;font:800 30px "Barlow Condensed",sans-serif}
.stat span{font-size:12px;color:var(--mute)}
dl{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;position:relative}
dt{color:var(--mute)}dd{margin:0;text-align:right;font-weight:500}
.wiki{display:block;margin-top:20px;text-align:center;padding:11px;background:var(--tc);color:#0a0b0e;font:700 18px "Barlow Condensed",sans-serif;letter-spacing:.04em;border-radius:10px;text-decoration:none;position:relative;transition:transform .2s}
.wiki:hover{transform:translateY(-2px)}
.head{display:flex;gap:14px;align-items:center;position:relative}
.ph{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--tc);background:var(--panel2);flex:none;animation:fade .6s}
.sec{margin-top:20px;position:relative}
.sec h3{margin:0 0 8px;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--tc)}
.stats.four{grid-template-columns:repeat(4,1fr)}
.bio{color:#c7ccd5;font-size:15px;line-height:1.5;margin:0}
.fact{background:var(--panel2);border:1px dashed var(--tc);border-radius:12px;padding:14px 16px;position:relative}
.fact p{margin:0 0 10px;font-size:15px;min-height:44px;animation:fade .4s}
.fact button{font:600 14px Barlow,sans-serif;background:none;color:var(--tc);border:1px solid var(--tc);border-radius:20px;padding:5px 12px;cursor:pointer;transition:transform .25s,background .2s}
.fact button:hover{background:var(--tc);color:#0a0b0e;transform:scale(1.05)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;padding:6px 10px;font-size:14px}
.chips b{font-weight:600;margin-left:6px;color:var(--mute)}
.sk{height:14px;margin:8px 0;border-radius:6px;background:linear-gradient(90deg,var(--panel2),#2a2e38,var(--panel2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:480px){.row{grid-template-columns:34px 1fr auto;gap:10px;padding:10px 12px 10px 16px}.name{font-size:20px}.name small{display:block;margin:0}.pts{font-size:26px}.stats.four{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}}
</style>
</head>
<body>
<div class="flag" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>F1 <span>Standings</span></h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <label>Season <select id="season"></select></label>
  </header>
  <div class="tabs" id="tabs" role="tablist">
    <div class="pill"></div>
    <button role="tab" id="t-d" aria-selected="true">Drivers</button>
    <button role="tab" id="t-c" aria-selected="false">Constructors</button>
  </div>
  <p class="meta" id="meta"></p>
  <div id="list" aria-live="polite"></div>
  <footer>Data: <a href="https://api.jolpi.ca/ergast/f1/" style="color:inherit">Jolpica F1 API</a>. Click a driver or team for details. Bios from Wikipedia.</footer>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="dn">
  <div class="card" id="card"></div>
</div>

<script>
const now0 = () => new Date().getFullYear();
const API = "https://api.jolpi.ca/ergast/f1";
const COLORS = {red_bull:"#3671c6",ferrari:"#e8002d",mercedes:"#27f4d2",mclaren:"#ff8000",aston_martin:"#229971",alpine:"#ff87bc",williams:"#64c4ff",rb:"#6692ff",alphatauri:"#5e8faa",sauber:"#52e252",kick_sauber:"#52e252",haas:"#b6babd",alfa:"#c92d4b",renault:"#ffd800",racing_point:"#f596c8",toro_rosso:"#469bff",audi:"#bb0a30",cadillac:"#9aa0a6"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let shown = String(now0()), tab = "drivers", season = "current", rowsCache = [], lastFocus = null;

$("season").innerHTML = '<option value="current">Current season</option>' +
  Array.from({length: now0() - 1949}, (_, i) => now0() - i).map(y => `<option>${y}</option>`).join("");

function setTab(t){
  tab = t;
  $("tabs").classList.toggle("c", t === "constructors");
  $("t-d").setAttribute("aria-selected", t === "drivers");
  $("t-c").setAttribute("aria-selected", t === "constructors");
  load();
}
$("t-d").onclick = () => setTab("drivers");
$("t-c").onclick = () => setTab("constructors");
$("season").onchange = e => { season = e.target.value; load(); };

async function load(){
  $("list").innerHTML = '<div class="state"><div class="spin"></div>Loading standings…</div>';
  const file = tab === "drivers" ? "driverstandings" : "constructorstandings";
  try {
    const res = await fetch(`${API}/${season}/${file}.json?limit=100`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const sl = (await res.json()).MRData.StandingsTable.StandingsLists[0];
    if (!sl) { $("list").innerHTML = '<div class="state">No standings published for this season yet.</div>'; $("meta").textContent = ""; return; }
    rowsCache = tab === "drivers" ? sl.DriverStandings : sl.ConstructorStandings;
    shown = sl.season;
    $("sub").textContent = `${sl.season} season · after round ${sl.round}`;
    $("meta").textContent = tab === "drivers" ? "Drivers’ Championship" : "Constructors’ Championship";
    const max = Math.max(...rowsCache.map(r => +r.points), 1);
    $("list").innerHTML = rowsCache.map((r, i) => {
      const team = tab === "drivers" ? r.Constructors[r.Constructors.length - 1] : r.Constructor;
      const color = COLORS[team && team.constructorId] || "#8a919e";
      const name = tab === "drivers"
        ? `${esc(r.Driver.givenName)} ${esc(r.Driver.familyName)}<small>${esc(team && team.name)}</small>`
        : esc(team.name);
      return `<div class="row click" tabindex="0" role="button" data-i="${i}" style="--i:${Math.min(i, 24)};--tc:${color}">
        <div class="pos">${esc(r.positionText)}</div>
        <div><div class="name">${name}</div><div class="track"><i style="--w:${(+r.points / max * 100).toFixed(1)}%"></i></div></div>
        <div class="pts" data-n="${esc(r.points)}">0<small>${r.wins} win${r.wins == 1 ? "" : "s"}</small></div></div>`;
    }).join("");
    document.querySelectorAll(".pts").forEach((p, i) => countUp(p, +p.dataset.n, i));
  } catch (e) {
    $("list").innerHTML = `<div class="state">Couldn’t load standings (${esc(e.message)}).<br>Check your connection and try again.<br><button id="retry">Retry</button></div>`;
    $("retry").onclick = load;
  }
}

function countUp(el, n, i){
  const small = el.querySelector("small").outerHTML;
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) { el.innerHTML = n + small; return; }
  const start = performance.now() + Math.min(i, 24) * 45, dur = 900;
  (function tick(t){
    const k = Math.min(Math.max((t - start) / dur, 0), 1), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = Math.round(n * e) + small;
    if (k < 1) requestAnimationFrame(tick);
  })(performance.now());
}

/* cards */
const cache = new Map();
const j = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };
const tot = r => +r.MRData.total;
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const ok = r => r.status === "fulfilled" ? r.value : null;

async function wiki(url){
  const t = url && url.split("/wiki/")[1];
  if (!t) return {};
  const [s, x] = (await Promise.allSettled([
    j(`https://en.wikipedia.org/api/rest_v1/page/summary/${t}`),
    j(`https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exchars=9000&redirects=1&titles=${t}&format=json&origin=*`)
  ])).map(ok);
  let facts = [];
  const pg = x && x.query && Object.values(x.query.pages)[0];
  if (pg && pg.extract) {
    facts = pg.extract.replace(/==+[^=\n]+==+/g, " ").split(/(?<=[.!?])\s+(?=[A-Z])/)
      .map(t => t.replace(/\s+/g, " ").trim()).filter(t => t.length > 55 && t.length < 240 && !/^\W/.test(t));
  }
  return {bio: s && s.extract, thumb: s && s.thumbnail && s.thumbnail.source, facts};
}

async function careerInfo(kind, id){
  const isDriver = kind === "d";
  const root = isDriver ? "drivers" : "constructors";
  const data = await j(`${API}/${root}/${id}/seasons.json?limit=100`);
  const seasons = data.MRData.SeasonTable.Seasons || [];
  return {seasons: seasons.length, first: seasons[0] && seasons[0].season};
}

function getExtra(kind, o){
  const id = kind === "d" ? o.driverId : o.constructorId;
  const k = kind + id + shown;
  if (cache.has(k)) return cache.get(k);
  const seasonBase = `${API}/${shown}`;
  const base = kind === "d" ? `${API}/drivers/${id}` : `${API}/constructors/${id}`;
  const root = kind === "d" ? "drivers" : "constructors";
  const standingsUrl = kind === "d"
    ? `${seasonBase}/drivers/${id}/driverstandings.json?limit=100`
    : `${seasonBase}/constructors/${id}/constructorstandings.json?limit=100`;
  const p = Promise.allSettled([
    j(standingsUrl),
    j(`${base}/results/1.json?limit=1`),
    j(`${base}/qualifying/1.json?limit=1`),
    j(`${seasonBase}/${root}/${id}/results/1.json?limit=1`),
    j(`${seasonBase}/${root}/${id}/qualifying/1.json?limit=1`),
    careerInfo(kind, id),
    wiki(o.url),
    kind === "c" ? j(`${seasonBase}/constructors/${id}/driverstandings.json`) : Promise.resolve(null)
  ]).then(rs => {
    const [st, w, q, sw, sq, career, wk, dr] = rs.map(ok);
    const lists = st && st.MRData.StandingsTable.StandingsLists;
    const standingsKey = kind === "d" ? "DriverStandings" : "ConstructorStandings";
    const current = lists && lists[0] && lists[0][standingsKey] && lists[0][standingsKey][0];
    const drivers = dr && dr.MRData.StandingsTable.StandingsLists[0] ? dr.MRData.StandingsTable.StandingsLists[0].DriverStandings.map(x => ({n: x.Driver.givenName + " " + x.Driver.familyName, p: x.points})) : [];
    return {
      current: {position: current && current.positionText, points: current && current.points, wins: sw ? tot(sw) : null, poles: sq ? tot(sq) : null},
      career: career || {titles: null},
      wins: w ? tot(w) : null, poles: q ? tot(q) : null, drivers, wk: wk || {}
    };
  });
  cache.set(k, p);
  return p;
}

const val = v => v == null ? "—" : v;
const wd = dob => new Date(dob + "T00:00:00Z").toLocaleDateString("en-GB", {weekday: "long", timeZone: "UTC"});
const ageOf = dob => { const d = new Date(dob), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; };

function extraHTML(kind, x, o){
  const currentStats = `<div class="stats four">
    <div class="stat"><b>${x.current.position ? "P" + esc(x.current.position) : "—"}</b><span>Position</span></div>
    <div class="stat"><b>${val(x.current.points)}</b><span>Points</span></div>
    <div class="stat"><b>${val(x.current.wins)}</b><span>Wins</span></div>
    <div class="stat"><b>${val(x.current.poles)}</b><span>Poles</span></div></div>`;
  const careerStats = `<div class="stats">
    <div class="stat"><b>${val(x.wins)}</b><span>Wins</span></div>
    <div class="stat"><b>${val(x.poles)}</b><span>Poles</span></div>
    <div class="stat"><b>${val(x.career.seasons)}</b><span>Seasons</span></div></div>`;
  const bio = x.wk.bio ? `<div class="sec"><h3>About</h3><p class="bio">${esc(x.wk.bio)}</p></div>` : "";
  const drv = kind === "c" && x.drivers.length ? `<div class="sec"><h3>${esc(shown)} drivers</h3><div class="chips">${x.drivers.map(d => `<span>${esc(d.n)}<b>${esc(d.p)} pts</b></span>`).join("")}</div></div>` : "";
  return `<div class="sec"><h3>Career current season · ${esc(shown)}${kind === "c" ? " (team)" : ""}</h3>${currentStats}</div>
    <div class="sec"><h3>Career since start${kind === "c" ? " (team)" : ""}${x.career.first ? " · since " + esc(x.career.first) : ""}</h3>${careerStats}</div>${drv}${bio}
    <div class="sec"><h3>Random fact</h3><div class="fact"><p id="fp"></p><button id="fb">🎲 Another one</button></div></div>`;
}

function setupFacts(kind, x, o){
  const pool = [];
  if (kind === "d" && o.dateOfBirth) {
    const days = Math.floor((Date.now() - new Date(o.dateOfBirth)) / 864e5);
    pool.push(`Born on a ${wd(o.dateOfBirth)} — that's ${days.toLocaleString()} days ago.`);
  }
  if (x.seasons) pool.push(`Has appeared in ${x.seasons} Formula 1 championship season${x.seasons > 1 ? "s" : ""}, starting in ${x.first}.`);
  if (x.wins != null) pool.push(`${x.wins} career race win${x.wins === 1 ? "" : "s"} and ${val(x.poles)} pole position${x.poles === 1 ? "" : "s"} in the record books.`);
  pool.push(...shuffle(x.wk.facts || []).slice(0, 14));
  const order = shuffle(pool); let n = 0;
  const show = () => { const p = $("fp"); if (!p) return; p.style.animation = "none"; p.offsetWidth; p.style.animation = ""; p.textContent = order[n++ % order.length] || "No fun fact available — try the Wikipedia link!"; };
  show(); $("fb").onclick = show;
}

function openCard(kind, i){
  const r = rowsCache[i];
  const team = kind === "d" ? r.Constructors[r.Constructors.length - 1] : r.Constructor;
  const o = kind === "d" ? r.Driver : r.Constructor;
  const color = COLORS[team && team.constructorId] || "#8a919e";
  const card = $("card");
  card.style.setProperty("--tc", color);
  const key = kind + (o.driverId || o.constructorId) + Date.now(); card.dataset.k = key;
  const dob = kind === "d" ? new Date(o.dateOfBirth).toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"}) : "";
  card.innerHTML = kind === "d" ? `
    <button class="x" id="x" aria-label="Close">✕</button>
    <div class="big" aria-hidden="true">${esc(o.permanentNumber || o.code || "")}</div>
    <div class="head"><div id="ph"></div><div><div class="code">${esc(o.code || "")}</div>
    <h2 id="dn">${esc(o.givenName)}<br>${esc(o.familyName)}</h2></div></div>
    <div class="team" style="margin-top:6px">${esc(r.Constructors.map(c => c.name).join(" / "))}</div>
    <div class="stats"><div class="stat"><b>P${esc(r.positionText)}</b><span>Position</span></div><div class="stat"><b>${esc(r.points)}</b><span>Points</span></div><div class="stat"><b>${esc(r.wins)}</b><span>Wins</span></div></div>
    <dl><dt>Nationality</dt><dd>${esc(o.nationality)}</dd><dt>Born</dt><dd>${esc(dob)} (age ${ageOf(o.dateOfBirth)})</dd><dt>Car number</dt><dd>${esc(o.permanentNumber || "—")}</dd></dl>
    <div id="extra"><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>`
  : `
    <button class="x" id="x" aria-label="Close">✕</button>
    <div class="big" aria-hidden="true">${esc(r.positionText)}</div>
    <div class="code">${esc(o.nationality)} · ${esc(shown)}</div>
    <h2 id="dn">${esc(o.name)}</h2>
    <div class="team">Constructors’ Championship</div>
    <div class="stats"><div class="stat"><b>P${esc(r.positionText)}</b><span>Position</span></div><div class="stat"><b>${esc(r.points)}</b><span>Points</span></div><div class="stat"><b>${esc(r.wins)}</b><span>Wins</span></div></div>
    <div id="extra"><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>`;
  lastFocus = document.activeElement;
  $("ov").classList.add("open"); $("x").focus(); $("x").onclick = closeCard;
  getExtra(kind, o).then(x => {
    if (card.dataset.k !== key) return;
    $("extra").innerHTML = extraHTML(kind, x, o) + (o.url ? `<a class="wiki" href="${esc(o.url)}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : "");
    if (kind === "d" && x.wk.thumb) $("ph").outerHTML = `<img class="ph" src="${esc(x.wk.thumb)}" alt="" onerror="this.remove()">`;
    setupFacts(kind, x, o);
  });
}
function closeCard(){ $("ov").classList.remove("open"); $("card").dataset.k = ""; lastFocus && lastFocus.focus(); }
$("ov").onclick = e => { if (e.target === $("ov")) closeCard(); };
addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });
$("list").addEventListener("click", e => { const r = e.target.closest(".row.click"); if (r) openCard(tab === "drivers" ? "d" : "c", +r.dataset.i); });
$("list").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".row.click")) { e.preventDefault(); openCard(tab === "drivers" ? "d" : "c", +e.target.dataset.i); }
});
load();
</script>
</body>
</html>
